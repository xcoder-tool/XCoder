[project]
name = "xcoder"
version = "0.1.0"
description = ""
authors = [{ name = "Danila Schelkov", email = "me@donutquine.dev" }]
requires-python = ">=3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "sc-compression>=0.6.9",
    "colorama==0.4.6",
    "pillow",
    "loguru==0.7.3",
    "sc-py",
]

[project.optional-dependencies]
lzham = ["sc-compression[lzham]"]

[dependency-groups]
dev = [
    "pyright>=1.1.376,<2",
    "black>=26.5.1,<27",
    "pre-commit>=3.8.0,<4",
    "ruff>=0.16.1,<0.17",
    "ty>=0.0.15",
]

[project.scripts]
xcoder = "xcoder.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xcoder"

[tool.uv.sources]
sc-py = { git = "https://github.com/xcoder-tool/sc-py.git" }
sc-compression = { git = "https://github.com/xcoder-tool/sc-compression.git" }

[tool.isort]
profile = "black"
force_sort_within_sections = true # Don't group `from` imports separately
order_by_type = true              # Order by CONSTANT, CamelCase, snake_case

[tool.basedpyright]
typeCheckingMode = "recommended" # Sets the base severity level

# Turn off specific rules globally
reportUnusedCallResult = false
reportAny = "none"
